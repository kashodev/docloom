<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240" role="img" aria-label="docsynth logo, slate and amber">
  <!-- Mark: a document page with a single thread weaving over/under its text lines -->
  <g>
    <rect x="25" y="15" width="120" height="170" rx="16" fill="#EEF3F9" stroke="#2C4A6E" stroke-width="10"/>
    <!-- text lines (weft) -->
    <g stroke="#2C4A6E" stroke-width="8" stroke-linecap="round">
      <line x1="52" y1="60"  x2="118" y2="60"/>
      <line x1="52" y1="95"  x2="118" y2="95"/>
      <line x1="52" y1="130" x2="105" y2="130"/>
    </g>
    <!-- the thread: over line 1, under line 2 (gap), over line 3, out the bottom -->
    <g stroke="#E8A33D" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M86 34 C 76 50, 94 68, 86 83"/>
      <path d="M85 107 C 78 126, 92 146, 85 165 C 80 178, 88 196, 84 214"/>
    </g>
  </g>
  <!-- Wordmark: geometric monoline "docsynth" -->
  <g transform="translate(185,52)" fill="none" stroke-width="11" stroke-linecap="round">
    <g stroke="#2C4A6E">
      <!-- d -->
      <circle cx="22" cy="78" r="22"/>
      <line x1="44" y1="26" x2="44" y2="100"/>
      <!-- o -->
      <circle cx="80" cy="78" r="22"/>
      <!-- c -->
      <path d="M152.1 61.1 A22 22 0 1 0 152.1 94.9"/>
      <!-- l -->
      <line x1="178" y1="26" x2="178" y2="100"/>
      <!-- m -->
      <path d="M312 100 V70 A13 13 0 0 1 338 70 V100"/>
      <path d="M338 70 A13 13 0 0 1 364 70 V100"/>
    </g>
    <!-- the "oo" of loom, in amber -->
    <g stroke="#E8A33D">
      <circle cx="218" cy="78" r="22"/>
      <circle cx="276" cy="78" r="22"/>
    </g>
  </g>
</svg>
