[project]
name = "docsynth"
version = "0.1.0"
description = "Weave templates and generated data into realistic documents with a computed golden dataset"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Okasha", email = "kasho.dev@gmail.com" }]
readme = "README.md"
keywords = ["synthetic-data", "invoices", "ocr", "document-ai", "golden-dataset", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Core deps run the whole local-first path — generate, render, export, and
# evaluate — with NO cloud account. Cloud SDKs and LLM providers are extras, so
# `pip install docsynth` stays lean and an OSS user can try it immediately.
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "playwright>=1.48",          # headless Chromium for PDF rendering
    "pikepdf>=9.0",              # re-wrap rasterised pages as PDF
    "pypdfium2>=4.30",           # rasterise a rendered PDF to page images (self-contained)
    "Pillow>=11.0",              # scan-degradation post-processing
    "numpy>=2.1",                # noise/texture generation
    "httpx>=0.27",               # provider HTTP clients (OpenAI-compatible)
    "pyarrow>=18.0",             # Parquet — the default golden format
    "duckdb>=1.1",               # local SQL evaluation, no server
    "structlog>=24.4",
    "typer>=0.13",               # CLI: docsynth generate | export
]

[project.optional-dependencies]
# Cloud storage/state/sinks. gs://, firestore://, bigquery:// need this.
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-firestore>=2.19",
    "google-cloud-bigquery>=3.26",
]
# s3:// storage.
aws = ["boto3>=1.35"]
# First-party Anthropic provider (Claude Haiku). DeepSeek and Qwen speak the
# OpenAI-compatible wire protocol and need only httpx, already in core.
anthropic = ["anthropic>=0.40"]
# Arrow-key prompts for the `docsynth studio` wizard. Optional: without it the
# wizard falls back to numbered menus + plain input, and a fully-flagged run
# needs nothing here at all.
studio = ["questionary>=2.0"]
# Everything, for a full deployment.
all = ["docsynth[gcp,aws,anthropic,studio]"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
docsynth = "docsynth.cli:app"

# Built-in packs register through the same entry-point group third parties use,
# so an out-of-tree pack needs no change to docsynth itself.
[project.entry-points."docsynth.packs"]
invoice = "docsynth.packs.invoice:InvoicePack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` ships every file under the tree, not just .py — so the archetype
# templates and the bundled OFL fonts (woff2 + licences) are included already.
# A `force-include` table for them adds a *second* copy at the same path and
# makes the wheel build fail outright; the build is the check that catches it.
packages = ["src/docsynth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N817",    # camelCase-imported-as-acronym — deliberate (e.g. ElementTree as ET)
    "N818",    # Error suffix on exceptions — renaming public exceptions is invasive
    "RUF001",  # ambiguous unicode in strings — intentional – / → glyphs
    "RUF002",  # ambiguous unicode in docstrings — intentional – / → glyphs
    "RUF003",  # ambiguous unicode in comments — intentional – / → glyphs
]

[tool.ruff.lint.per-file-ignores]
# Bilingual product-catalogue data rows — wrapping hurts readability.
"src/docsynth/packs/invoice/catalog.py" = ["E501"]
# Inline SVG markup in triple-quoted templates — can't wrap the opening tag.
"src/docsynth/packs/invoice/stamps.py" = ["E501"]
# Dev smoke scripts and tests: long literals/assertions are fine.
"scripts/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
